name: Validar Meca Sim
on: [push, workflow_dispatch]
# Apenas o HEAD mais recente gera um kit de distribuição.
concurrency:
  group: meca-sim-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de física, servidor e JVM
        run: python -m unittest discover -s tests -v 2>&1 | tee reports/python-tests.txt
      - name: Matemática e gamepads JavaScript
        run: node --test tests/model.test.mjs 2>&1 | tee reports/javascript-tests.txt
      - name: Compatibilidade com nove OpModes preservados
        run: python tests/repository_compatibility.py 2>&1 | tee reports/compatibility.jsonl
      - name: Cenários de falha com Java real
        run: python tests/fault_scenarios.py
      - name: Instalar navegador de teste
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Interface e integração completas
        run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ matrix.os }}
          path: reports/


  executavel-windows:
    name: Empacotar Windows
    needs: testes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Criar MecaSim.exe
        run: python -m PyInstaller --noconfirm --clean mecasim.spec
      - name: Diagnóstico do executável
        run: dist/MecaSim.exe --diagnostico
      - name: Smoke test de servidor e recursos empacotados
        run: python tests/packaged_smoke.py dist/MecaSim.exe
      - name: Montar kit pronto para extrair
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/kit | Out-Null
          Copy-Item dist/MecaSim.exe dist/kit/
          Copy-Item INICIAR_TESTE.bat,TESTE_AMANHA.md,RESULTADO_TESTE.md dist/kit/
          if ((Get-ChildItem dist/kit -File).Count -ne 4) { throw "Kit incompleto" }
      - uses: actions/upload-artifact@v4
        with:
          name: MecaSim-Windows-portatil
          path: dist/kit/
          if-no-files-found: error
